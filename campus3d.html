<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#fff0d0"><title>黏土校園 3D 互動地圖｜臺南特教</title>
<style>
:root{--ink:#3c3b37;--paper:#fff0d0;--panel:#fffdf4}
*{box-sizing:border-box}
html,body{height:100%;margin:0;overflow:hidden;background:var(--paper);font-family:"Microsoft JhengHei","Noto Sans TC",sans-serif;color:var(--ink)}
#view{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
header{position:fixed;left:16px;right:16px;top:calc(12px + env(safe-area-inset-top,0px));display:flex;align-items:center;justify-content:space-between;gap:12px;pointer-events:none}
.brand,.tools{background:#fffdf0ee;border:3px solid #fff;border-radius:18px;padding:9px 13px;box-shadow:0 7px 18px #72573a30;pointer-events:auto}
.brand{font-weight:900;color:#984b3c}.brand small{display:block;font-size:.76rem;color:#756a57;font-weight:600}
.tools{display:flex;gap:7px;flex-wrap:wrap;justify-content:flex-end}
button,a{font:inherit}
button,.tools a{border:2px solid #fff;border-radius:999px;padding:7px 13px;color:#53432c;font-weight:800;text-decoration:none;cursor:pointer;background:#ffd16b;box-shadow:0 3px 0 #ce9841}
.tools a{background:#a2dfd2;box-shadow:0 3px 0 #68aa9e}
button:nth-child(2){background:#f6a69d;box-shadow:0 3px 0 #cf7e76}
button:hover,.tools a:hover{filter:saturate(1.2);transform:translateY(-1px)}
#hint{position:fixed;left:50%;bottom:calc(14px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#fffdf0ee;border:2px solid white;border-radius:999px;padding:8px 15px;box-shadow:0 5px 16px #72573a26;font-size:.88rem;white-space:nowrap;color:#665b4a}
#status{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);padding:12px 18px;background:#fffdf0e8;border-radius:14px;box-shadow:0 8px 24px #72573a30;font-weight:700}
#status.error{color:#9c3028}
@media(max-width:620px){header{left:8px;right:8px;top:calc(8px + env(safe-area-inset-top,0px));align-items:flex-start}.brand{font-size:.88rem;padding:7px 9px}.brand small{font-size:.68rem}.tools{padding:6px;gap:4px}.tools button,.tools a{font-size:.75rem;padding:6px 9px}#hint{font-size:.72rem;max-width:94vw;white-space:normal;text-align:center}}
</style></head><body>
<canvas id="view" aria-label="可旋轉、平移及縮放的黏土風格校園立體地圖"></canvas>
<header><div class="brand">臺南特教校園<small>黏土模型｜互動 3D 地圖</small></div>
<div class="tools"><button id="reset">重設視角</button><button id="top">俯視地圖</button><a href="lesson.html">危險空間導覽</a><a href="index.html">照片與巡查</a></div></header>
<div id="hint">拖曳旋轉視角・右鍵拖曳平移・滾輪或雙指縮放</div>
<div id="status">正在載入校園模型…</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
const canvas=document.getElementById("view"),status=document.getElementById("status");
const renderer=new THREE.WebGLRenderer({canvas,antialias:true,alpha:false});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.08;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
const scene=new THREE.Scene();scene.background=new THREE.Color(0xa8dff4);scene.fog=new THREE.Fog(0xa8dff4,58,110);
const camera=new THREE.PerspectiveCamera(38,1,.1,300);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true;controls.dampingFactor=.065;controls.enablePan=true;
controls.minDistance=16;controls.maxDistance=76;controls.maxPolarAngle=Math.PI*.49;controls.target.set(0,0,0);
scene.add(new THREE.HemisphereLight(0xfff5df,0x849f73,2.0));
const sun=new THREE.DirectionalLight(0xfff2d6,1.2);sun.position.set(-18,35,24);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);scene.add(sun);
function roundedBox(w,h,d,r){
 const g=new THREE.BoxGeometry(w,h,d,6,6,6),p=g.attributes.position,v=new THREE.Vector3(),q=new THREE.Vector3();
 r=Math.min(r,w/2-.01,h/2-.01,d/2-.01);
 for(let i=0;i<p.count;i++){v.fromBufferAttribute(p,i);q.set(Math.max(-w/2+r,Math.min(w/2-r,v.x)),Math.max(-h/2+r,Math.min(h/2-r,v.y)),Math.max(-d/2+r,Math.min(d/2-r,v.z)));v.sub(q).normalize().multiplyScalar(r).add(q);p.setXYZ(i,v.x,v.y,v.z)}
 g.computeVertexNormals();return g
}
const ratio=1677/938,mapW=39,mapD=mapW/ratio;
const plinth=new THREE.Mesh(roundedBox(mapW+.75,.68,mapD+.75,.35),new THREE.MeshStandardMaterial({color:0xffd480,roughness:.9}));
plinth.position.y=-.38;plinth.castShadow=true;plinth.receiveShadow=true;scene.add(plinth);
const trim=new THREE.Mesh(roundedBox(mapW+.3,.18,mapD+.3,.18),new THREE.MeshStandardMaterial({color:0xf49a86,roughness:.9}));
trim.position.y=-.06;scene.add(trim);
const mapMaterial=new THREE.MeshStandardMaterial({color:0xffffff,roughness:.96,metalness:0});
const map=new THREE.Mesh(new THREE.PlaneGeometry(mapW,mapD),mapMaterial);
map.rotation.x=-Math.PI/2;map.position.y=.04;map.receiveShadow=true;scene.add(map);
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener("resize",resize);resize();
function home(top=false){camera.position.set(0,top?48:25,top?.01:32);controls.target.set(0,0,0);controls.update()}
home();
document.getElementById("reset").onclick=()=>home();
document.getElementById("top").onclick=()=>home(true);
fetch("clay-campus-map.webp.txt?v=1").then(r=>{if(!r.ok)throw new Error("地圖圖片載入失敗");return r.text()}).then(b64=>{
 const tex=new THREE.TextureLoader().load("data:image/webp;base64,"+b64.trim(),()=>{mapMaterial.needsUpdate=true;status.style.display="none"},undefined,()=>{status.textContent="圖片載入失敗，請重新整理頁面";status.classList.add("error")});
 tex.encoding=THREE.sRGBEncoding;tex.anisotropy=renderer.capabilities.getMaxAnisotropy();mapMaterial.map=tex;mapMaterial.needsUpdate=true;
}).catch(e=>{status.textContent=e.message+"。請確認網路連線。";status.classList.add("error")});
(function animate(){requestAnimationFrame(animate);controls.update();renderer.render(scene,camera)})();
</script></body></html>
